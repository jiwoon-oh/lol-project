# S1 네이버 뉴스 검색어 (find_articles.py)
# {nick} = players.yaml name_ko, {team} = team, {real} = real_name

# 기간은 period.yaml
display: 100                 # 네이버 API 1회 최대 100건
max_pages: 3                 # 검색어당 최대 300건까지 훑음 (sort=date)
max_articles_per_player: 40  # CLAUDE.md S1 상한

templates:
  - '{nick} 인터뷰'
  - '{nick} 경기 후 인터뷰'
  - '{real}'
issue_template: '{nick} {team} {issue}'
# 팀 대상 검색어 (2026-11-03). {nick} = 팀 한글 이름
team_templates: ['{nick} 밴픽', '{nick} 운영', '{nick} 감독 인터뷰', '{nick} 조합', '{nick} 코치', '{nick} LCK 경기 후 인터뷰']
issues: [재계약, 교체, 은퇴, 국가대표, MSI, 월즈]

# 제목+요약에 이 중 하나는 있어야 함 (동명이인·일반어 제거: 오너솔루션, 사진작가 최현준, HD현대 이상혁 등)
# '롤'·'탑'·'미드'처럼 다른 낱말 안에 흔히 들어가는 짧은 말은 넣지 않음 (롤스로이스, 탑클래스, 미드필더)
context_words: ['T1', 'LCK', 'LoL', '리그 오브 레전드', '리그오브레전드', 'e스포츠', '이스포츠',
                '롤드컵', '월즈', 'MSI', '아시안게임', '정글러', '페이커', '도란', '케리아',
                '구마유시', '페이즈', '젠지', '한화생명', '프로게이머', '게이머']

# 제목에 이 중 하나가 있으면 인터뷰, 아니면 기사
# 네이버 API 제목은 길면 "…"로 잘려서 '[쿠키인터...', '(인터...' 형태도 넣음. S2에서 원문 전체 제목으로 다시 판정
interview_markers: ['인터뷰', '[인터뷰]', 'Q&A', '일문일답', '쿠키인터', '(인터', 'LCK 톡톡']

# 제목 유사도(rapidfuzz ratio, 0~100) 이 값 이상이면 중복으로 봄
title_dup_threshold: 90

# ---- S1-c 영어 매체 (2026-11-03) — 검색 대신 사이트맵 순회 (collect_english.py) ----
# 검색 RSS(Bing)는 질의당 10건뿐이라 폐기. robots.txt 의 Sitemap 을 따라 URL 슬러그로 선수·팀을 매칭.
english:
  enabled: true
  max_per_player: 30           # 선수·팀 폴더당 상한 (인터뷰 우선, 패치별로 고르게)
  max_child_sitemaps: 60       # 사이트당 하위 사이트맵 상한 (실행 시간 제한). --max-child 로 덮어씀
  # robots.txt 에 사이트맵이 있고 / 허용 확인(2026-11-03). Dot Esports 는 HTTP 451 → 제외
  sitemap_sites: [www.invenglobal.com, www.sheepesports.com, www.dexerto.com, esports.gg,
                  www.gosugamers.net, www.koreaherald.com]
  # 이 매체 기사만 씀 (도메인 끝부분 일치)
  allowed_domains: [invenglobal.com, sheepesports.com, dotesports.com, dexerto.com, esports.gg,
                    lolesports.com, theesportsadvocate.com, upcomer.com, esportsinsider.com,
                    oneesports.gg, gamerant.com, sportskeeda.com, gosugamers.net, koreaherald.com]
  interview_markers: ['interview', 'Interview', 'Q&A', 'talks', 'speaks']
  context_words: ['T1', 'LCK', 'LoL', 'League of Legends', 'esports', 'Worlds', 'MSI', 'jungler', 'mid laner', 'top laner']
  # 슬러그 매칭 (소문자 낱말 단위)
  slug_interview_words: [interview, q-a, qa]
  slug_context_words: [t1, lck, lol, league, esports, worlds, msi]   # + 팀 별칭
  common_ids: [Life, Clear, Career, Rich, Frog, Ghost, Duro, Peter, Smash]  # 일반어와 겹침 → 문맥어 필요 (players.yaml ambiguous 도 포함)
  slug_exclude_words: [vct, valorant, overwatch, dota, dota2, cs2, csgo, melee, pokemon, fortnite, apex, rocket]  # 다른 종목 (T1 은 발로란트팀도 있음)
  weak_team_aliases: [GEN, BRO, NS, DN, DNS, KRX]                          # 팀 별칭 중 문맥어 필요한 것
  team_extra_aliases:                                                 # teams.yaml 별칭 외 슬러그 표기
    Gen.G: [gen g, geng]
    Hanwha Life Esports: [hanwha, hanwha life]
    Dplus Kia: [dplus, dplus kia]
    Nongshim RedForce: [nongshim, nongshim redforce]
    BNK FEARX: [fearx, bnk fearx]
    HANJIN BRION: [brion, hanjin brion]
    Kiwoom DRX: [drx, kiwoom drx]
    DN SOOPers: [soopers, dn soopers]
