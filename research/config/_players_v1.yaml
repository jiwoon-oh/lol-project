# 파일럿 대상 선수와 별칭
# - aliases: 정규식. 글·댓글을 고르는 데와 S5 "선수 근처 인용" 확인에만 사용 (판정 기준 아님)
# - exclude: 별칭과 겹치지만 선수가 아닌 표현. 이 패턴에 걸린 부분은 별칭 매치에서 뺌
# - 맨 "현준"은 도란(최현준)·오너(문현준) 둘 다라서 별칭으로 쓰지 않음 (쌍현준·현준이들 등)
# 근거: 인벤 본문 + 유튜브 T1·LCK·롤PS 댓글 토큰 빈도 확인 (2026-11-02)

players:
  Doran:
    name_ko: 도란
    real_name: 최현준
    team: T1
    position: 탑
    inven_search: Doran          # data/inven_2026/search/{inven_search}.csv
    aliases:
      - '도란'
      - '(?i)\bdoran\b'
      - '최현준'
    exclude:
      - '도란도란'                # "도란도란 이야기하다"
      - '도란\s?(검|링|방패|템)'    # 아이템
      - "(?i)doran[’']?s\\s+(blade|ring|shield)"   # Doran's Blade 등 아이템 (영어 소유격 "Doran's"는 선수라서 남김)
      - '야구도란'                 # 다른 대상 밈

  Oner:
    name_ko: 오너
    real_name: 문현준
    team: T1
    position: 정글
    inven_search: Oner
    aliases:
      - '오너'
      - '(?i)\boner\b'
      - '문현준'
    exclude:
      - '이리\s?오너라'
      - '구단\s?오너'
      - '오너\s?(십|쉽|리스크|일가|경영)'

  Faker:
    name_ko: 페이커
    real_name: 이상혁
    team: T1
    position: 미드
    inven_search: Faker
    aliases:
      - '페이커'
      - '(?i)\bfaker\b'
      - '이상혁'
      - '대상혁'
      - '(?<![가-힣])상혁'          # 상혁이, 상혁이형, 상혁아 (앞에 다른 글자가 붙은 탑상혁·신상혁 등은 제외)
    exclude:
      - '페이커즈'                 # 팬덤·밈 표현은 선수 본인 얘기가 아닐 수 있음 → 제외
      - '@\S*상혁\S*'              # 유튜브 핸들 (@신상혁-88848 등)
