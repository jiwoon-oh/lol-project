<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선수 프로필 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* FM-style player sheet, compact: everything should fit in about two screen heights on a laptop.
   left = photo + vitals + career | centre = radar vs position average, champions | right = report, ban-pick */
:root{
  --bg:#0b0b0e; --panel:#15151a; --panel-2:#1c1c23; --line:#2a2a33;
  --fg:#f1f0ee; --mute:#9a98a3; --dim:#6b6975;
  --a:#e4002b; --a-ink:#fff; --b:#1c070b; --c:#f2d49b;
  --good:#3fcf73; --ok:#e7c35a; --bad:#ef5b4b;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}

.head{border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--a) 22%,var(--bg)) 0,var(--bg) 60%)}
.head .in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pos{font-family:var(--mono);font-weight:600;font-size:12.5px;background:var(--a);color:var(--a-ink);padding:2px 8px;border-radius:3px;letter-spacing:.08em}
.head h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.head .sub{color:var(--mute);font-size:15px}
.head .sub b{color:var(--fg);font-weight:500}
.head .tag{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);padding:2px 8px;border-radius:10px}

.grid{max-width:1400px;margin:0 auto;padding:10px 16px 16px;display:grid;gap:10px;
  grid-template-columns:285px minmax(0,1.15fr) minmax(0,1fr);
  grid-template-areas:"left radar report" "left metrics metrics" "left sum sum" "left champ banpick";align-items:stretch}
.a-left{grid-area:left;display:grid;gap:10px;align-content:start}
.a-left > .box{height:auto}
.a-sum{grid-area:sum}.a-radar{grid-area:radar}.a-report{grid-area:report}.a-champ{grid-area:champ}
.a-banpick{grid-area:banpick}.a-metrics{grid-area:metrics}
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0;height:100%}
.box > h3{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2;letter-spacing:.01em;color:var(--c);margin-bottom:10px;padding-left:9px;border-left:3px solid var(--a)}
.box > h3 small{font-family:var(--body);font-size:12.5px;color:var(--mute);margin-left:6px;letter-spacing:0}

/* left */
.card{padding:0;overflow:hidden;height:auto}
.photo{position:relative;height:270px;background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--a) 55%,#000) 0,var(--b) 70%);overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.photo .teamtag{position:absolute;left:10px;top:8px;font-family:var(--display);font-size:22px;color:#fff;opacity:.9;text-shadow:0 1px 6px #000}
.photo .credit{position:absolute;right:6px;bottom:3px;font-size:10.5px;color:#fff;opacity:.5;font-family:var(--mono)}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line)}
.vitals > div{padding:7px 4px;border-right:1px solid var(--line)}
.vitals > div:last-child{border-right:0}
.vitals .k{display:block;font-size:12.5px;color:var(--mute)}
.vitals .v{font-family:var(--mono);font-size:17px;font-weight:600}
.vitals.big{background:var(--panel-2)}
.vitals.big .v{font-size:22px;color:var(--c)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mute);font-size:12.5px;text-align:left;padding:3px 5px;border-bottom:1px solid var(--line)}
td{padding:4px 5px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.career td{padding:6px 5px;font-size:15px}
.career .tm{font-weight:500;display:block}
.career .pd{display:block;font-family:var(--mono);font-size:12px;color:var(--mute)}
.career .cur td{background:color-mix(in srgb,var(--a) 12%,transparent)}
.foot{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}
.wr-hi{color:var(--good)} .wr-lo{color:var(--bad)}

/* summary strip */
.sum ul{margin:0;padding-left:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 18px}
.sum li{font-size:14.5px}

/* radar */
.rad{display:flex;justify-content:center}
.radar{display:block;width:100%;max-width:430px;height:auto}
.radar text{font-family:var(--body);font-size:12.5px;font-weight:500;fill:var(--fg)}
.radar text.rg{font-family:var(--mono);font-size:10.5px;font-weight:400;fill:var(--dim)}
/* metric explanations */
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.met{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:7px 10px;min-width:0}
.met .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.met .n{font-weight:700;font-size:14.5px}
.met .rk{font-family:var(--mono);font-size:12px;color:var(--dim)}
.met .v{font-family:var(--mono);font-size:15px}
.met .v .av{color:var(--mute);font-size:12.5px;margin-left:4px}
.met .up{color:var(--good)} .met .dn{color:var(--bad)}
.met .d{font-size:12.5px;color:var(--mute);line-height:1.3;margin-top:1px}
.key{font-size:12px;color:var(--dim);margin-top:6px}
.key i{display:inline-block;width:16px;vertical-align:middle;margin:0 4px 0 8px}
.key i:first-child{margin-left:0}

/* champions */
.champ td,.champ th{padding:5px 6px}
.champ td{font-size:14.5px}
.champ td:first-child{font-weight:500}
.chip{font-family:var(--mono);font-size:11.5px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;flex:none}
.chip.strong{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.chip.mid{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.weak{color:var(--dim)}

/* report */
.rep{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep h4{font-size:15px;font-weight:700;text-align:center;padding:5px;border-radius:3px;margin-bottom:10px}
.rep .pro h4{background:color-mix(in srgb,var(--good) 30%,#0f2a19);color:#d6f7e2}
.rep .con h4{background:color-mix(in srgb,var(--bad) 32%,#2a0f0f);color:#ffdcd6}
.rep ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.rep li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:15px;line-height:1.45}
.ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#08130c;margin-top:1px}
.pro .ico{background:var(--good)} .con .ico{background:var(--bad);color:#2a0606}
.rec{font-family:var(--mono);font-size:11.5px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:3px;padding:0 3px;margin-right:4px}
.bullets{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14.5px}

.disclaim{max-width:1400px;margin:0 auto;padding:0 16px 20px;color:var(--dim);font-size:12.5px}

@media (max-width:1180px){
  .grid{grid-template-columns:260px minmax(0,1fr);
    grid-template-areas:"left radar" "left metrics" "left report" "sum sum" "champ banpick"}
  .sum ul{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"left" "radar" "metrics" "report" "sum" "champ" "banpick"}
  .rep{grid-template-columns:minmax(0,1fr)}
  .mets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .radar{max-width:340px;margin:0 auto}
}
</style>
</head>
<body>
<header class="head"><div class="in" id="head"></div></header>
<main class="grid" id="app"></main>
<div class="disclaim">샘플 레이아웃 (도란). 문장은 "이 출처들이 이 선수를 이렇게 본다"는 요약이며 실제 기량과 다를 수 있음. 신뢰도: 강함 = 서로 다른 출처 2개 이상 + 기록과 맞음 · 보통 · 약함. 2026 기록 = Oracle's Elixir, 2026-08-25까지.</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const S = JSON.parse(document.getElementById('data').textContent), p = S.p;
const THEMES = {
  "T1":{short:"T1",a:"#e4002b",ink:"#fff",b:"#1c070b",c:"#f2d49b"},
  "Gen.G":{short:"GEN.G",a:"#b8955a",ink:"#111",b:"#15120c",c:"#e9d3a4"},
  "Hanwha Life Esports":{short:"HLE",a:"#f47b20",ink:"#111",b:"#1b0f07",c:"#ffc999"},
  "KT Rolster":{short:"KT",a:"#c9c9cf",ink:"#111",b:"#121216",c:"#ff4b5c"},
  "Dplus Kia":{short:"DK",a:"#2ed3c1",ink:"#06201d",b:"#07141f",c:"#9ff3e8"},
  "Nongshim RedForce":{short:"NS",a:"#d7263d",ink:"#fff",b:"#170a0b",c:"#f6e7c8"},
  "BNK FEARX":{short:"BFX",a:"#ffc81e",ink:"#111",b:"#15130a",c:"#fff0b3"},
  "HANJIN BRION":{short:"BRO",a:"#1fae5b",ink:"#04140a",b:"#07160e",c:"#b9efcd"},
  "Kiwoom DRX":{short:"DRX",a:"#3d74ff",ink:"#fff",b:"#08102a",c:"#a9c3ff"},
  "DN SOOPers":{short:"DNS",a:"#8b6bff",ink:"#fff",b:"#100b22",c:"#d3c6ff"}
};
const th = THEMES[p.team] || THEMES.T1;
for (const [k,v] of [["--a",th.a],["--a-ink",th.ink],["--b",th.b],["--c",th.c]]) document.documentElement.style.setProperty(k,v);

const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x,d=0) => x==null||isNaN(x) ? "-" : (x*100).toFixed(d)+"%";
const sgn = x => x==null||isNaN(x) ? "-" : (x>0?"+":"")+Math.round(x);
const chip = conf => { const c=(conf||"").trim(); if(!c) return "";
  const k=c.startsWith("강함")?"strong":c.startsWith("보통")?"mid":c.startsWith("약함")?"weak":"";
  return `<span class="chip ${k}" title="${esc(c)}">${esc(c.split(" ")[0])}</span>`; };
const POS_EN = {"탑":"TOP","정글":"JGL","미드":"MID","원딜":"ADC","바텀":"ADC","서폿":"SUP","서포터":"SUP"};
const COUNTRY = {"South Korea":"대한민국"};
const A = Object.fromEntries(p.attrs.map(a=>[a.key,a]));
function fmtRaw(k,v){
  if(["kp","damageshare","earnedgoldshare"].includes(k)) return pct(v,1);
  if(k.startsWith("golddiff")||k.startsWith("xpdiff")) return sgn(v);
  if(k.startsWith("csdiff")) return (v>0?"+":"")+(+v).toFixed(1);
  return (+v).toFixed(k==="dpm"?0:2);
}
const age = S.birth ? Math.floor((new Date("2026-08-25")-new Date(S.birth))/3.15576e10) : null;

document.getElementById('head').innerHTML = `
  <span class="pos">${esc(POS_EN[p.position]||p.position)}</span>
  <h1>${esc(p.id)}</h1>
  <span class="sub"><b>${esc(p.name_ko)}</b> · ${esc(p.real_name||"")} · <b>${esc(p.team)}</b></span>
  <span class="tag">${p.reviewed?"S7 검토 반영":"S7 미검토"} · 2026-08-25 기준</span>`;

/* ---------- left ---------- */
window.SIL = `<svg viewBox="0 0 160 172" aria-hidden="true"><circle cx="80" cy="70" r="30" fill="#000" fill-opacity=".35"/><path d="M18 172 C22 126 48 108 80 108 C112 108 138 126 142 172 Z" fill="#000" fill-opacity=".35"/></svg>`;
const photo = S.photo
  ? `<img src="${esc(S.photo)}" alt="${esc(p.id)} 사진" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createRange().createContextualFragment(window.SIL))">`
  : window.SIL;
const wrc = w => w>=.6?'wr-hi':w<.45?'wr-lo':'';
const careerRows = S.career.map((c,i)=>`<tr class="${i===0?'cur':''}"><td><span class="tm">${esc(c.team)}</span><span class="pd">${esc(c.period)}</span></td>
  <td class="r num">${c.games}</td><td class="r num ${wrc(c.winrate)}">${pct(c.winrate,1)}</td></tr>`).join("");
const left = `<div class="a-left">
  <div class="box card">
    <div class="photo">${photo}<span class="teamtag">${esc(th.short)}</span>${S.photo_credit?`<span class="credit">사진: ${esc(S.photo_credit)}</span>`:""}</div>
    <div class="vitals">
      <div><span class="k">나이</span><span class="v">${age??"-"}<small>${age!=null?"세":""}</small></span></div>
      <div><span class="k">포지션</span><span class="v">${esc(POS_EN[p.position]||p.position)}</span></div>
      <div><span class="k">국적</span><span class="v" style="font-family:var(--body);font-size:13px">${esc(COUNTRY[S.country]||S.country||"-")}</span></div>
    </div>
    <div class="vitals big">
      <div><span class="k">경기</span><span class="v">${p.overall.games}</span></div>
      <div><span class="k">승률</span><span class="v">${pct(p.overall.winrate,1)}</span></div>
      <div><span class="k">KDA</span><span class="v">${p.overall.kda}</span></div>
    </div>
  </div>
  <div class="box"><h3>커리어</h3>
    <table class="career"><thead><tr><th>팀 · 기간</th><th class="r">경기</th><th class="r">승률</th></tr></thead><tbody>${careerRows}</tbody></table>
    <div class="foot">공식 대회 전체(정규·플레이오프·국제전·KeSPA컵). 2025년까지 Leaguepedia, 2026년은 경기 기록 08-25까지.</div>
  </div>
</div>`;

/* ---------- radar: player vs position average, each axis scaled to the position's min–max ---------- */
const AXES = [["DPM","dpm"],["딜 비중","damageshare"],["골드 비중","earnedgoldshare"],["KDA","kda"],["데스","deaths"],
              ["시야","vspm"],["XPD@15","xpdiffat15"],["CSD@15","csdiffat15"],["GD@15","golddiffat15"]].filter(([,k])=>A[k]&&S.ranges[k]);
const norm = (k,v)=>{const [lo,hi]=S.ranges[k];let t=hi>lo?(v-lo)/(hi-lo):.5;if(k==="deaths")t=1-t;return Math.max(0,Math.min(1,t));};
const rng = k=>{const [lo,hi]=S.ranges[k];return k==="deaths"?`${fmtRaw(k,hi)}–${fmtRaw(k,lo)}`:`${fmtRaw(k,lo)}–${fmtRaw(k,hi)}`;};
function radar(){
  const W=372,H=290,cx=W/2,cy=H/2+2,R=98,n=AXES.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=f=>AXES.map(([,k],i)=>pt(i,R*f(k)).map(v=>v.toFixed(1)).join(",")).join(" ");
  let g=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--panel-2)" stroke="var(--dim)" stroke-width="1"/>`;
  g+=[.25,.5,.75].map(f=>`<circle cx="${cx}" cy="${cy}" r="${R*f}" fill="none" stroke="var(--line)"/>`).join("");
  g+=AXES.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;}).join("");
  g+=`<polygon points="${poly(k=>norm(k,A[k].pos_mean))}" fill="none" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>`;
  g+=`<polygon points="${poly(k=>norm(k,A[k].value))}" fill="var(--a)" fill-opacity=".28" stroke="var(--a)" stroke-width="2" stroke-linejoin="round"/>`;
  g+=AXES.map(([,k],i)=>{const [x,y]=pt(i,R*norm(k,A[k].value));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--a)"/>`;}).join("");
  g+=AXES.map(([lab,k],i)=>{const [x,y]=pt(i,R+16);const anc=Math.abs(x-cx)<6?"middle":x>cx?"start":"end";const dy=y<cy-R*0.6?-6:y>cy+R*0.6?8:0;
    return `<g><title>${esc(A[k].label)} ${fmtRaw(k,A[k].value)} · 포지션 평균 ${fmtRaw(k,A[k].pos_mean)} · ${A[k].rank}/${A[k].of}위</title>
      <text x="${x.toFixed(1)}" y="${(y+dy-1).toFixed(1)}" text-anchor="${anc}">${lab}</text>
      <text class="rg" x="${x.toFixed(1)}" y="${(y+dy+10).toFixed(1)}" text-anchor="${anc}">(${rng(k)})</text></g>`;}).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="능력치: 선수 대 포지션 평균">${g}</svg>`;
}
const better = (k,v,m)=> k==="deaths" ? v<m : v>m;
const radarBox = `<div class="box a-radar"><h3>지표<small>포지션 평균 대비</small></h3>
  <div class="rad">${radar()}</div>
  <div class="key"><i style="border-top:2px solid var(--a)"></i>${esc(p.id)}<i style="border-top:2px dotted var(--c)"></i>LCK ${esc(p.position)} 평균 (리서치 대상 ${S.n_peers}명) · 축 범위 = 그 ${S.n_peers}명의 최소–최대 · 바깥일수록 좋음 (데스는 적을수록 바깥)</div>
</div>`;

const DESC = {dpm:"분당 상대 챔피언에게 준 피해량", damageshare:"팀 전체 챔피언 피해 중 이 선수 몫", earnedgoldshare:"팀이 번 골드 중 이 선수 몫",
  kda:"(킬 + 어시스트) ÷ 데스", deaths:"경기당 평균 데스. 적을수록 좋음", vspm:"분당 시야 점수 (와드 설치·제거)",
  xpdiffat15:"15분 맞라이너 대비 경험치 차", csdiffat15:"15분 맞라이너 대비 CS 차", golddiffat15:"15분 맞라이너 대비 골드 차"};
const metBox = `<div class="box a-metrics"><h3>지표 설명<small>순위 = LCK ${esc(p.position)} ${S.n_peers}명 중</small></h3><div class="mets">${AXES.map(([lab,k])=>{const a=A[k],d=better(k,a.value,a.pos_mean);
  return `<div class="met"><div class="t"><span class="n">${lab}</span><span class="rk">${a.rank}/${a.of}위</span></div>
    <div class="v"><span class="${d?'up':'dn'}">${fmtRaw(k,a.value)}</span><span class="av">평균 ${fmtRaw(k,a.pos_mean)}</span></div>
    <div class="d">${DESC[k]||esc(a.label)}</div></div>`;}).join("")}</div></div>`;

/* ---------- champions ---------- */
const champRows = (p.champions||[]).slice(0,8).map(c=>`<tr><td>${esc(c.champion)}</td><td class="r num">${c.games}</td>
  <td class="r num ${wrc(c.winrate)}">${pct(c.winrate)}</td><td class="r num">${(+c.kda).toFixed(2)}</td><td class="r num">${sgn(c.golddiffat15)}</td></tr>`).join("");
const champBox = `<div class="box a-champ"><h3>챔피언 폭</h3><table class="champ"><thead><tr><th>챔피언</th><th class="r">G</th><th class="r">승률</th><th class="r">KDA</th><th class="r">GD15</th></tr></thead><tbody>${champRows}</tbody></table></div>`;

/* ---------- report ---------- */
// 샘플 규칙: 플레이스타일 문장 중 부정어·엇갈림 없는 것 = 장점, 약점 = 프로필 4장.
// 기록 장점/약점 = 능력치 점수 14 이상 / 6 이하.
const NEG = /기복|무리|약점|저하|변동|쏠/, MIX = /엇갈|논쟁/;
const recTxt = a => `${a.label} ${fmtRaw(a.key,a.value)} (${a.rank}/${a.of})`;
const pros = [...p.playstyle.filter(c=>!NEG.test(c.claim)&&!MIX.test(c.claim)).map(c=>({t:c.claim,conf:c.conf})),
              ...p.attrs.filter(a=>a.score>=14).map(a=>({t:recTxt(a),rec:1}))];
const cons = [...p.weak.map(c=>({t:c.claim.replace(/\s*\(.*?\)\s*$/,""),conf:c.conf})),
              ...p.attrs.filter(a=>a.score<=6).map(a=>({t:recTxt(a),rec:1}))];
const item = (x,ico)=>`<li><span class="ico">${ico}</span><span>${x.rec?'<span class="rec">기록</span>':''}${esc(x.t)} ${x.conf?chip(x.conf):''}</span></li>`;
const reportBox = `<div class="box a-report"><h3>보고서</h3>
  <div class="rep"><div class="pro"><h4>장점</h4><ul>${pros.map(x=>item(x,"✓")).join("")}</ul></div>
  <div class="con"><h4>단점</h4><ul>${cons.map(x=>item(x,"!")).join("")}</ul></div></div>
</div>`;

/* ---------- ban-pick, summary ---------- */
const banBox = `<div class="box a-banpick"><h3>밴픽 시사점<small>추론</small></h3><ul class="bullets">${p.banpick.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`;
const sumBox = `<div class="box a-sum sum"><h3>스카우트 요약</h3><ul>${p.summary.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`;

document.getElementById('app').innerHTML = left + radarBox + metBox + reportBox + sumBox + champBox + banBox;
document.title = `${p.id} · 선수 프로필 샘플`;

</script>
</body>
</html>
